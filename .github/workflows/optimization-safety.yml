name: Optimization safety checks
on:
  pull_request:
  push:
    branches:
      - "optimization/**"
      - "main"
permissions:
  contents: read
jobs:
  regression:
    name: Build, tests and visual baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check:visual-baseline
      - run: npm run audit:modules
      - run: npm test
      - run: npm run build
        if: always()
      - name: Verify genuine pixel pet images generated for Dynamic Island
        run: node -e "const fs=require('fs');for(const n of ['adult/dog','sleep/dog','adult/dino','teen/penguin']){const p='public/assets/island/'+n+'.png';if(!fs.existsSync(p)||fs.statSync(p).size<200)throw Error('Missing island portrait '+p)}"
        if: success()
      - run: npm run check:visual-baseline
        if: always()
      - name: Render all species, ages and wardrobe comparison sheets
        run: npm run visual:matrix
        if: success()
      - name: Upload visual evolution comparison sheets
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: visual-evolution-14-pets
          path: artifacts/visual-evolution/*.png
          retention-days: 7

  graphic-qa:
    name: Private Canvas lab in Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:graphic-qa
      - name: Verify iPhone companion actual canvas and care controls
        run: node scripts/companion-browser-qa.mjs
      - name: Upload browser frames and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graphic-qa-browser
          path: tmp/graphic-qa/
          retention-days: 7
