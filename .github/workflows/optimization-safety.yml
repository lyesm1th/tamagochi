name: Optimization safety checks
on:
  pull_request:
  push:
    branches:
      - "optimization/**"
      - "main"
permissions:
  contents: read
jobs:
  regression:
    name: Build, tests and visual baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check:visual-baseline
      - run: npm run audit:modules
      - run: npm test
      - run: npm run build
        if: always()
      - run: npm run check:visual-baseline
        if: always()
      - name: Render all species, ages and wardrobe comparison sheets
        run: npm run visual:matrix
        if: success()
      - name: Upload visual evolution comparison sheets
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: visual-evolution-14-pets
          path: artifacts/visual-evolution/*.png
          retention-days: 7

  graphic-qa:
    name: Private Canvas lab in Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Select available Chromium browser
        timeout-minutes: 4
        run: |
          browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$browser_path" ]; then
            echo "CHROMIUM_EXECUTABLE_PATH=$browser_path" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps --only-shell chromium
          fi
      - run: npm run build
      - run: node scripts/graphic-qa-25d.mjs
      - run: npm run test:graphic-qa
      - name: Upload browser frames and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graphic-qa-browser
          path: |
            tmp/graphic-qa/
            tmp/graphic-qa-25d/
          retention-days: 7
