name: Dinosaur art preview
on:
  pull_request:
    paths:
      - 'public/dino-*'
      - 'public/detailed-renderer.js'
      - 'scripts/build-dino-age-art.mjs'
      - 'tests/dino-age-art.test.js'
      - 'package.json'
      - '.github/workflows/dino-art-preview.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:dino
      - run: node --test tests/dino-age-art.test.js
      - run: npm run build
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: dino-age-preview
          path: public/art/detailed/dino-age-authored.webp
          retention-days: 14
